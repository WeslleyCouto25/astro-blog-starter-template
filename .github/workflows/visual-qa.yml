name: Visual QA — mobile, desktop, formulário
on:
  push:
    branches: [comprartccbrasil-v4-design-editorial]
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Test responsive layout, navigation, contact flow and JS
        run: node scripts/browser-smoke.cjs
      - name: Screenshots and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: qa-screenshots/
          retention-days: 14
